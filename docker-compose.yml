
version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: elearning
    ports:
      - "3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
  node-api:
    build: ./backend-node
    ports:
      - "3000:3000"
    depends_on:
      - db
  php-dashboard:
    build: ./backend-php
    ports:
      - "8080:80"
    depends_on:
      - db
